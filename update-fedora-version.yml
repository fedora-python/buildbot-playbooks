- name: Update Fedora machines to the next version
  hosts: "{{ target_hosts }}"
  become: true
  serial: 1
  tasks:
    - name: Download the packages
      command: dnf system-upgrade download --refresh -y --releasever="{{ version }}"

    - name: Begin the update process
      shell: dnf system-upgrade reboot
      async: 1
      poll: 0
      ignore_unreachable: true

    # The whole offline upgrade transaction runs before sshd is back, so this
    # has to cover it, not just the reboot. The check polls every second and
    # returns as soon as the host answers, so a generous bound costs nothing.
    - name: Wait for machine to come back
      wait_for_connection:
        delay: 60
        timeout: 3600

